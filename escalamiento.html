<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Escalamiento de Soporte | Hábitos con Dios</title>
</head>

<body>

  <h1>Todavía necesito ayuda</h1>

  <p>
    Gracias por indicarnos que la respuesta recibida no resolvió completamente tu consulta.
  </p>

  <p>
    Ya tenemos el contexto de tu caso. Cuéntanos qué información sigues necesitando para que nuestro equipo pueda ayudarte mejor.
  </p>

  <div id="caseContext"></div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const caseId = params.get("id");

    console.log("ESCALATION_CASE_ID", caseId);

    document.getElementById("caseContext").innerHTML = `
      <div style="
        margin-top:20px;
        padding:20px;
        border:1px solid #E8DECC;
        border-radius:16px;
        background:#FAF7F0;
      ">
        <p><strong>ID detectado:</strong> ${caseId}</p>
      </div>
    `;
  </script>

</body>
</html>
