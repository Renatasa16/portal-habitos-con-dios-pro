<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Escalamiento de Soporte | Hábitos con Dios</title>
</head>

<body>

  <h1>Todavía necesito ayuda</h1>

  <p>
    Gracias por indicarnos que la respuesta recibida no resolvió completamente tu consulta.
  </p>

  <p>
    Ya tenemos el contexto de tu caso. Cuéntanos qué información sigues necesitando para que nuestro equipo pueda ayudarte mejor.
  </p>

  <div id="caseContext"></div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const caseId = params.get("id");

    console.log("ESCALATION_CASE_ID", caseId);

    fetch(`/api/escalation?id=${caseId}`)
  .then(response => response.json())
  .then(data => {

    document.getElementById("caseContext").innerHTML = `
  <div style="
    margin-top:20px;
    padding:20px;
    border:1px solid #E8DECC;
    border-radius:16px;
    background:#FAF7F0;
  ">

    <p>
      <strong>Caso:</strong>
      ${data.case.case_id}
    </p>

    <p>
      <strong>Tu consulta:</strong><br>
      ${data.case.question || "No disponible"}
    </p>

    <p>
      <strong>Respuesta recibida:</strong><br>
      ${data.case.response || "No disponible"}
    </p>

  </div>
`;

  })
  .catch(error => {
    console.error(error);

    document.getElementById("caseContext").innerHTML = `
      <div style="color:red;">
        No pudimos cargar la información del caso.
      </div>
    `;
  });
  </script>

</body>
</html>
