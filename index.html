  <style>
    :root {
      --green: #3F4A35;
      --olive: #556544;
      --gold: #C9A65A;

      --cream: #FAF7F0;
      --ink: #1F2937;
      --white: #FFFFFF;
      --muted: #6B7280;
      --line: #E8DECC;
      --soft-green: #EEF3EA;
      --soft-gold: #F7EAC7;
      --soft-rose: #F5E3DD;
      --shadow: 0 22px 60px rgba(63, 74, 53, 0.14);
      --shadow-soft: 0 12px 34px rgba(63, 74, 53, 0.10);
      --radius-xl: 32px;
      --radius-lg: 24px;
      --radius-md: 18px;
    }

    }

      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 3px solid rgba(201, 166, 90, 0.88);
      outline-offset: 4px;
    }

    img {

    }

    .page-shell {

      font-weight: 700;
      text-align: center;
      padding: 10px 16px;
      letter-spacing: 0.01em;
    }

    .navbar {

      z-index: 50;

      background: rgba(250, 247, 240, 0.9);
      border-bottom: 1px solid rgba(232, 222, 204, 0.85);
    }

      justify-content: space-between;

      padding: 16px 0;
    }

    .brand {

      align-items: center;
      gap: 12px;
      min-width: fit-content;
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--green);
      color: var(--gold);

      color: var(--olive);
      font-weight: 800;
      font-size: 14px;

      transition: 0.2s ease;
      line-height: 1;
    }

    .nav-links a:hover {
      color: var(--green);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

      padding: 13px 20px;

      font-size: 14px;
      cursor: pointer;
      transition: 0.2s ease;
      line-height: 1;
      text-align: center;
      min-height: 44px;
    }

    .btn-primary {
      background: var(--green);
      color: var(--white);
      box-shadow: 0 14px 28px rgba(63, 74, 53, 0.22);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      filter: brightness(1.04);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.82);
      color: var(--green);
      border: 1px solid var(--line);
    }

    .btn-secondary:hover {
      background: var(--white);
      transform: translateY(-2px);
    }

    .btn-gold {
      background: var(--gold);
      color: var(--green);

      cursor: pointer;
      min-height: 44px;
    }

      display: grid;

      color: var(--green);
      font-weight: 900;
      box-shadow: var(--shadow-soft);
    }

    .mobile-nav-inner a {
      padding: 12px 10px;
      border-radius: 12px;
      transition: 0.2s ease;
    }

    .mobile-nav-inner a:hover {
      background: var(--soft-green);
    }

      gap: 8px;

      color: var(--olive);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .eyebrow-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 0 4px rgba(201, 166, 90, 0.18);
      flex: 0 0 auto;
    }

      font-size: clamp(48px, 8vw, 88px);
      line-height: 0.9;
      letter-spacing: -0.075em;
      color: var(--green);
      margin-bottom: 22px;
    }

    .hero h1 span {
      color: var(--gold);
      display: block;
    }

      font-size: clamp(19px, 2.4vw, 27px);
      line-height: 1.22;
      color: var(--ink);
      font-weight: 800;
      max-width: 680px;
      margin-bottom: 16px;
    }

    .hero-description {

      line-height: 1.75;

      margin-bottom: 28px;

      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

      margin-bottom: 2px;

    }

    .hero-panel {
      position: relative;
    }

      overflow: hidden;
      position: relative;
    }
