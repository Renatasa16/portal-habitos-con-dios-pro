<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Dashboard | Hábitos con Dios Pro</title>

  <meta
    name="description"
    content="Dashboard premium de Hábitos con Dios Pro para acceder a la colección 21 Días Más Cerca de Dios, sus bonos digitales y la App Devocional Mi Tiempo con Dios."
  />

  <meta name="theme-color" content="#3F4A35" />

  <meta property="og:title" content="Dashboard | Hábitos con Dios Pro" />
  <meta
    property="og:description"
    content="Accede a la experiencia inicial de Hábitos con Dios Pro: 21 Días Más Cerca de Dios, bonos digitales y la App Devocional Mi Tiempo con Dios."
  />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Hábitos con Dios Pro" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></>
    :root {
      --green: #3F4A35;
      --olive: #556544;
      --gold: #C9A65A;
      --beige: #F5F0E7;
      --cream: #FAF7F0;
      --ink: #1F2937;
      --white: #FFFFFF;
      --muted: #6B7280;
      --line: #E8DECC;
      --soft-green: #EEF3EA;
      --soft-gold: #F7EAC7;
      --soft-red: #FCEEEE;
      --red: #9F3A38;
      --shadow: 0 22px 60px rgba(63, 74, 53, 0.14);
      --shadow-soft: 0 12px 34px rgba(63, 74, 53, 0.10);
      --radius-xl: 32px;
      --radius-lg: 24px;
      --radius-md: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 110px;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(201, 166, 90, 0.22), transparent 34%),
        radial-gradient(circle at 80% 10%, rgba(85, 101, 68, 0.14), transparent 28%),
        linear-gradient(145deg, var(--cream), var(--beige));
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 3px solid rgba(201, 166, 90, 0.88);
      outline-offset: 4px;
    }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: 12px;
      z-index: 999;
      background: var(--gold);
      color: var(--green);
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 900;
    }

    .skip-link:focus {
      left: 12px;
    }

    .page-shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    .announcement {
      width: 100%;
      background: var(--green);
      color: var(--cream);
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      padding: 10px 16px;
      letter-spacing: 0.01em;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(16px);
      background: rgba(250, 247, 240, 0.92);
      border-bottom: 1px solid rgba(232, 222, 204, 0.85);
    }

    .nav-inner {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 16px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: fit-content;
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--green);
      color: var(--gold);
      display: grid;
      place-items: center;
      font-weight: 900;
      letter-spacing: -0.04em;
      box-shadow: var(--shadow-soft);
      flex: 0 0 auto;
    }

    .brand-text small {
      display: block;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--olive);
      font-size: 10px;
      font-weight: 900;
    }

    .brand-text strong {
      display: block;
      color: var(--green);
      font-size: 19px;
      line-height: 1.1;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 18px;
      color: var(--olive);
      font-weight: 800;
      font-size: 14px;
    }

    .nav-links a {
      transition: 0.2s ease;
      line-height: 1;
    }

    .nav-links a:hover {
      color: var(--green);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 999px;
      padding: 13px 20px;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s ease;
      line-height: 1.2;
      text-align: center;
      min-height: 44px;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--green);
      color: var(--white);
      box-shadow: 0 14px 28px rgba(63, 74, 53, 0.22);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      filter: brightness(1.04);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.82);
      color: var(--green);
      border: 1px solid var(--line);
    }

    .btn-secondary:hover {
      background: var(--white);
      transform: translateY(-2px);
    }

    .btn-gold {
      background: var(--gold);
      color: var(--green);
      box-shadow: 0 12px 26px rgba(201, 166, 90, 0.26);
    }

    .btn-gold:hover {
      transform: translateY(-2px);
      filter: brightness(1.03);
    }

    .btn-disabled {
      background: rgba(255, 255, 255, 0.68);
      color: var(--muted);
      border: 1px solid var(--line);
      cursor: not-allowed;
      pointer-events: none;
      box-shadow: none;
    }

    .mobile-menu {
      display: none;
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--green);
      border-radius: 14px;
      padding: 10px 12px;
      font-weight: 900;
      cursor: pointer;
      min-height: 44px;
    }

    .mobile-nav {
      display: none;
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 0 0 16px;
    }

    .mobile-nav.open {
      display: block;
    }

    .mobile-nav-inner {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 14px;
      display: grid;
      gap: 8px;
      color: var(--green);
      font-weight: 900;
      box-shadow: var(--shadow-soft);
    }

    .mobile-nav-inner a {
      padding: 12px 10px;
      border-radius: 12px;
      transition: 0.2s ease;
    }

    .mobile-nav-inner a:hover {
      background: var(--soft-green);
    }

    .dashboard-hero {
      padding: 64px 0 34px;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 26px;
      align-items: stretch;
    }

    .hero-card {
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(232, 222, 204, 0.96);
      border-radius: var(--radius-xl);
      padding: 34px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      position: relative;
      overflow: hidden;
    }

    .hero-card::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(201, 166, 90, 0.14);
      right: -86px;
      top: -88px;
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid var(--line);
      color: var(--olive);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 18px;
      position: relative;
      z-index: 1;
    }

    .eyebrow-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 0 4px rgba(201, 166, 90, 0.18);
      flex: 0 0 auto;
    }

    .hero-card h1 {
      font-size: clamp(42px, 6vw, 72px);
      line-height: 0.92;
      letter-spacing: -0.07em;
      color: var(--green);
      margin-bottom: 18px;
      position: relative;
      z-index: 1;
    }

    .hero-card h1 span {
      display: block;
      color: var(--gold);
    }

    .hero-card p {
      color: var(--muted);
      font-size: 17px;
      line-height: 1.75;
      max-width: 680px;
      position: relative;
      z-index: 1;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 24px;
      position: relative;
      z-index: 1;
    }

    .premium-status {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 30px;
      position: relative;
      z-index: 1;
    }

    .status-card {
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      text-align: center;
      backdrop-filter: blur(10px);
      transition: 0.25s ease;
    }

    .status-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-soft);
    }

    .status-card strong {
      display: block;
      font-size: 28px;
      font-weight: 900;
      color: var(--green);
      margin-bottom: 6px;
    }

    .status-card span {
      display: block;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }

    .stats-card {
      background: var(--green);
      color: var(--white);
      border-radius: var(--radius-xl);
      padding: 28px;
      box-shadow: var(--shadow);
      display: grid;
      align-content: center;
      gap: 14px;
      position: relative;
      overflow: hidden;
    }

    .stats-card::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(201, 166, 90, 0.18);
      right: -64px;
      top: -64px;
    }

    .stat {
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 22px;
      padding: 18px;
      position: relative;
      z-index: 1;
    }

    .stat strong {
      display: block;
      color: var(--gold);
      font-size: 30px;
      line-height: 1;
      margin-bottom: 6px;
    }

    .stat span {
      color: #EFE7D8;
      font-weight: 800;
      font-size: 13px;
    }

    section {
      padding: 44px 0;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 22px;
    }

    .section-heading h2 {
      color: var(--green);
      font-size: clamp(32px, 4vw, 48px);
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .section-heading p {
      color: var(--muted);
      line-height: 1.65;
      max-width: 640px;
      margin-top: 8px;
    }

    .grid {
      display: grid;
      gap: 18px;
    }

    .quick-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .resource-grid,
    .roadmap-grid,
    .updates-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .card {
      background: rgba(255, 255, 255, 0.84);
      border: 1px solid rgba(232, 222, 204, 0.96);
      border-radius: var(--radius-lg);
      padding: 22px;
      box-shadow: var(--shadow-soft);
      transition: 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
    }

    .card.soon {
      opacity: 0.94;
    }

    .card-icon {
      width: 46px;
      height: 46px;
      border-radius: 18px;
      background: var(--green);
      color: var(--gold);
      display: grid;
      place-items: center;
      font-weight: 900;
      margin-bottom: 16px;
      font-size: 22px;
      line-height: 1;
    }

    .card h3 {
      color: var(--green);
      font-size: 20px;
      line-height: 1.15;
      margin-bottom: 10px;
    }

    .card p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
      margin-bottom: 18px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 14px;
    }

    .badge-available {
      background: var(--soft-green);
      color: var(--green);
    }

    .badge-soon {
      background: var(--soft-gold);
      color: var(--green);
    }

    .badge-premium {
      background: var(--green);
      color: var(--gold);
    }

    .resource-card {
      padding: 0;
      overflow: hidden;
    }

    .resource-image {
      height: 138px;
      background:
        linear-gradient(135deg, rgba(63, 74, 53, 0.92), rgba(85, 101, 68, 0.88)),
        radial-gradient(circle at top right, rgba(201, 166, 90, 0.24), transparent 36%);
      display: flex;
      align-items: flex-end;
      padding: 18px;
      color: var(--gold);
      font-weight: 900;
      letter-spacing: -0.03em;
      font-size: 22px;
    }

    .resource-image.soon-image {
      filter: saturate(0.9);
      opacity: 0.86;
    }

    .resource-body {
      padding: 20px;
    }

    .mvp-note {
      margin-top: 20px;
      padding: 18px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.78);
      color: var(--muted);
      line-height: 1.65;
      font-size: 14px;
      position: relative;
      z-index: 1;
    }

    .mvp-note strong {
      color: var(--green);
    }

    .membership {
      display: grid;
      grid-template-columns: 0.95fr 1.05fr;
      gap: 22px;
      align-items: stretch;
    }

    .membership-card {
      background:
        linear-gradient(145deg, rgba(63, 74, 53, 0.96), rgba(85, 101, 68, 0.94)),
        radial-gradient(circle at top right, rgba(201, 166, 90, 0.24), transparent 34%);
      color: var(--white);
      border-radius: var(--radius-xl);
      padding: 34px;
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }

    .membership-card h2 {
      font-size: clamp(34px, 5vw, 56px);
      line-height: 0.98;
      letter-spacing: -0.055em;
      margin-bottom: 12px;
    }

    .membership-card p {
      color: #EDE5D6;
      line-height: 1.7;
      max-width: 660px;
    }

    .premium-pill {
      display: inline-flex;
      background: var(--gold);
      color: var(--green);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 18px;
    }

    .premium-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 24px;
    }

    .premium-item {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 16px;
      text-align: center;
    }

    .premium-item strong {
      display: block;
      color: var(--gold);
      font-size: 24px;
      line-height: 1;
      margin-bottom: 6px;
    }

    .premium-item span {
      color: #EFE7D8;
      font-size: 12px;
      font-weight: 800;
    }

    .benefits-list {
      display: grid;
      gap: 12px;
    }

    .benefit-row {
      background: rgba(255, 255, 255, 0.84);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      box-shadow: var(--shadow-soft);
    }

    .benefit-row h3 {
      color: var(--green);
      margin-bottom: 4px;
      font-size: 17px;
    }

    .benefit-row p {
      color: var(--muted);
      line-height: 1.55;
      font-size: 14px;
      margin: 0;
    }

    .check {
      width: 30px;
      height: 30px;
      border-radius: 12px;
      background: var(--soft-gold);
      color: var(--green);
      display: grid;
      place-items: center;
      font-weight: 900;
      flex: 0 0 auto;
    }

    footer {
      background: var(--green);
      color: var(--cream);
      padding: 32px 0;
      margin-top: 36px;
    }

    .footer-inner {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: center;
    }

    footer strong {
      color: var(--gold);
      display: block;
      margin-bottom: 8px;
    }

    footer p {
      color: #EDE5D6;
      font-size: 13px;
      line-height: 1.6;
      max-width: 760px;
    }

    .footer-links {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      color: #EDE5D6;
      font-weight: 800;
      font-size: 13px;
    }

    .footer-links a:hover {
      color: var(--gold);
    }

    @media (max-width: 1040px) {
      .dashboard-hero,
      .membership {
        grid-template-columns: 1fr;
      }

      .quick-grid,
      .resource-grid,
      .roadmap-grid,
      .updates-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .footer-inner {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 760px) {
      .nav-links,
      .nav-actions {
        display: none;
      }

      .mobile-menu {
        display: inline-flex;
      }

      .dashboard-hero {
        padding: 42px 0 24px;
      }

      .hero-card {
        padding: 24px;
      }

      .hero-card h1 {
        font-size: 46px;
      }

      .premium-status,
      .quick-grid,
      .resource-grid,
      .roadmap-grid,
      .updates-grid,
      .premium-stats {
        grid-template-columns: 1fr;
      }

      .section-heading {
        display: block;
      }

      .section-heading p {
        margin-top: 10px;
      }

      .membership-card {
        padding: 26px;
        border-radius: 26px;
      }

      .footer-links {
        flex-direction: column;
      }
    }

    @media (max-width: 420px) {
      .page-shell,
      .nav-inner,
      .mobile-nav,
      .footer-inner {
        width: min(100% - 22px, 1180px);
      }

      .brand-mark {
        width: 42px;
        height: 42px;
      }

      .brand-text strong {
        font-size: 16px;
      }

      .btn {
        width: 100%;
      }

      .hero-card h1 {
        font-size: 42px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <div class="announcement">
    Lanzamiento inicial activo: 21 Días Más Cerca de Dios + bonos + App Devocional
  </div>

  <nav class="navbar" aria-label="Navegación principal del dashboard">
    <div class="nav-inner">
      <a class="brand" href="dashboard.html" aria-label="Ir al dashboard de Hábitos con Dios Pro">
        <div class="brand-mark" aria-hidden="true">HD</div>
        <div class="brand-text">
          <small>Dashboard Premium</small>
          <strong>Hábitos con Dios Pro</strong>
        </div>
      </a>

      <div class="nav-links" aria-label="Secciones del dashboard">
        <a href="index.html">Inicio</a>
        <a href="biblioteca.html">Biblioteca</a>
        <a href="#recursos">Recursos</a>
        <a href="#proximamente">Próximamente</a>
        <a href="#cuenta">Mi Acceso</a>
      </div>

      <div class="nav-actions">
        <a class="btn btn-secondary" href="index.html">Volver al Portal</a>
      </div>

      <button
        class="mobile-menu"
        type="button"
        aria-label="Abrir menú de navegación"
        aria-controls="mobileNav"
        aria-expanded="false"
        id="mobileMenuButton"
      >
        Menú
      </button>
    </div>

    <div class="mobile-nav" id="mobileNav" aria-hidden="true">
      <div class="mobile-nav-inner">
        <a href="index.html">Inicio</a>
        <a href="biblioteca.html">Biblioteca</a>
        <a href="#recursos">Recursos</a>
        <a href="#proximamente">Próximamente</a>
        <a href="#cuenta">Mi Acceso</a>
        <a href="index.html">Volver al Portal</a>
      </div>
    </div>
  </nav>

  <main id="main" tabindex="-1">
    <section class="dashboard-hero page-shell" aria-labelledby="dashboard-title">
      <div class="hero-card">
        <div class="eyebrow">
          <span class="eyebrow-dot" aria-hidden="true"></span>
          COLECCIÓN ACTIVA
        </div>

        <h1 id="dashboard-title">
          Te damos la bienvenida,
          <span id="userName">Cargando...</span>
        </h1>

        <p>
          Accede a la experiencia inicial de Hábitos con Dios Pro: el ebook
          <strong>21 Días Más Cerca de Dios</strong>, sus bonos digitales y la App Devocional

  <script>
    const SUPABASE_URL = "PEGA_AQUI_TU_PROJECT_URL";
    const SUPABASE_PUBLISHABLE_KEY = "PEGA_AQUI_TU_PUBLISHABLE_KEY";

    const mobileNav = document.getElementById("mobileNav");
    const menuButton = document.getElementById("mobileMenuButton");
    const mobileLinks = document.querySelectorAll(".mobile-nav a");

    function setExpanded(value) {
      if (!menuButton || !mobileNav) return;

      menuButton.setAttribute("aria-expanded", value ? "true" : "false");
      menuButton.setAttribute(
        "aria-label",
        value ? "Cerrar menú de navegación" : "Abrir menú de navegación"
      );

      mobileNav.setAttribute("aria-hidden", value ? "false" : "true");
    }

    function toggleMenu() {
      if (!mobileNav) return;

      const isOpen = mobileNav.classList.toggle("open");
      setExpanded(isOpen);
    }

    function closeMenu() {
      if (!mobileNav) return;

      mobileNav.classList.remove("open");
      setExpanded(false);
    }

    if (menuButton) {
      menuButton.addEventListener("click", toggleMenu);
    }

    mobileLinks.forEach(function (link) {
      link.addEventListener("click", closeMenu);
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        closeMenu();
      }
    });

    function getFriendlyNameFromEmail(email) {
      if (!email || typeof email !== "string") return "continúa tu camino espiritual";

      const firstPart = email.split("@")[0] || "";
      const firstName = firstPart
        .split(/[._-]/)
        .filter(Boolean)[0];

      if (!firstName) return email;

      return firstName.charAt(0).toUpperCase() + firstName.slice(1);
    }

    async function loadUserProfile() {
      const userNameElement = document.getElementById("userName");

      if (!userNameElement) return;

      const configurationIsMissing =
        SUPABASE_URL === "PEGA_AQUI_TU_PROJECT_URL" ||
        SUPABASE_PUBLISHABLE_KEY === "PEGA_AQUI_TU_PUBLISHABLE_KEY";

      if (configurationIsMissing) {
        userNameElement.textContent = "continúa tu camino espiritual";
        console.warn("Supabase no está configurado todavía. Reemplaza SUPABASE_URL y SUPABASE_PUBLISHABLE_KEY.");
        return;
      }

      if (!window.supabase) {
        userNameElement.textContent = "continúa tu camino espiritual";
        console.warn("No se pudo cargar Supabase desde el CDN.");
        return;
      }

      const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

      const {
        data: { user },
        error
      } = await supabaseClient.auth.getUser();

      if (error) {
        console.warn("No se pudo obtener el usuario autenticado:", error.message);
        userNameElement.textContent = "continúa tu camino espiritual";
        return;
      }

      if (!user) {
        userNameElement.textContent = "continúa tu camino espiritual";
        return;
      }

      const metadata = user.user_metadata || {};

      const displayName =
        metadata.full_name ||
        metadata.name ||
        metadata.display_name ||
        getFriendlyNameFromEmail(user.email) ||
        user.email ||
        "Usuario";

      userNameElement.textContent = displayName;
    }

    loadUserProfile();
  </script>
